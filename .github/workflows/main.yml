name: Build and push Docker image to azure container registry
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Checkout del código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v2

      # Paso 2: Iniciar sesión en Azure utilizando el Service Principal
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Paso 3: Construir la imagen Docker
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY_SERVER }}/sphere_api:${{ github.sha }} .

      # Paso 4: Iniciar sesión en el Azure Container Registry
      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}

      # Paso 5: Push de la imagen Docker al Azure Container Registry
      - name: Push Docker image to Azure Container Registry
        run: |
          docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_SERVER }}/sphere_api:${{ github.sha }}
